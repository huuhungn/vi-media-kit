[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "vi-media-kit"
version = "0.1.1"
description = "Small toolkit for Vietnamese speech/subtitle apps: SRT, dubbing, video export, model download, diagnostics"
requires-python = ">=3.11"
license = "MIT"
license-files = ["LICENSE"]
dependencies = ["numpy", "soundfile"]
authors = [{ name = "anhtahaylove" }]

[project.optional-dependencies]
qt = ["PySide6-Essentials"]
hw = ["psutil"]

[tool.setuptools.packages.find]
where = ["src"]
